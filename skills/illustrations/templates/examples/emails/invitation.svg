<!-- A letter's picture: 560 × 240, the band at the top of a letter, about the letter's moment —
     here a door opening onto the product's world, the light reaching the floor. Same rules as a
     state picture; drawn wide, with the subject in the middle third so a narrow client can crop
     the sides. Classes and keyframes start with the picture's id ("invitation"). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" aria-hidden="true">
  <style>
    .invitation__door { transform-box: view-box; transform-origin: 236px 160px; animation: invitation-open var(--ill-duration-long) var(--ill-ease) 1 both; }
    .invitation__light { transform-box: view-box; transform-origin: 236px 200px; animation: invitation-light var(--ill-duration-long) var(--ill-ease) 1 both; }
    @keyframes invitation-open { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.35); } }
    @keyframes invitation-light { 0% { opacity: 0; transform: scaleX(0.2); } 100% { opacity: 1; transform: scaleX(1); } }
  </style>
  <ellipse cx="280" cy="208" rx="190" ry="18" fill="var(--ill-ground)"/>
  <path class="invitation__light" d="M236 200 L324 200 L420 232 L150 232 Z" fill="var(--ill-accent-soft)" opacity="0.8"/>
  <rect x="228" y="60" width="104" height="140" rx="4" fill="var(--ill-accent-soft)"/>
  <rect x="228" y="60" width="104" height="140" rx="4" fill="none" stroke="var(--ill-line)" stroke-width="2.5"/>
  <path d="M236 68 L324 68 L324 192 L236 192 Z" fill="var(--ill-accent)" opacity="0.35"/>
  <g class="invitation__door">
    <rect x="236" y="68" width="88" height="124" rx="2" fill="var(--ill-fill)" stroke="var(--ill-line)" stroke-width="2.5"/>
    <rect x="248" y="82" width="64" height="40" rx="2" fill="none" stroke="var(--ill-muted)" stroke-width="2"/>
    <rect x="248" y="134" width="64" height="40" rx="2" fill="none" stroke="var(--ill-muted)" stroke-width="2"/>
    <circle cx="312" cy="130" r="4" fill="var(--ill-accent)"/>
  </g>
  <path d="M120 200 L120 150" stroke="var(--ill-line)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="132" r="22" fill="var(--ill-soft)" stroke="var(--ill-line)" stroke-width="2.5"/>
  <path d="M440 200 L440 160" stroke="var(--ill-line)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="440" cy="144" r="18" fill="var(--ill-soft)" stroke="var(--ill-line)" stroke-width="2.5"/>
  <circle cx="98" cy="60" r="3" fill="var(--ill-accent)"/>
  <circle cx="470" cy="80" r="2.5" fill="var(--ill-accent)"/>
</svg>
