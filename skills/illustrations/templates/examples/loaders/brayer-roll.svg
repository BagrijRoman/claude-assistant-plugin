<!-- A loader: the mark's own parts in motion, never a new drawing. The roller rocks over the sheet
     and the stripe of ink grows under it; the last keyframe is the mark at rest, so under
     reduced motion (one iteration, no duration) the loader is the still mark. Durations come from
     the --ill-duration-* tokens. Classes and keyframes start with the loader's id ("brayer-roll"). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <style>
    .brayer-roll__roller { transform-box: view-box; transform-origin: 28px 31px; animation: brayer-roll-rock var(--ill-duration-long) var(--ill-ease-in-out) infinite; }
    .brayer-roll__stripe { transform-box: view-box; transform-origin: 8px 50px; animation: brayer-roll-ink var(--ill-duration-long) var(--ill-ease-in-out) infinite; }
    @keyframes brayer-roll-rock { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes brayer-roll-ink { 0% { transform: scaleX(0.2); } 50% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
  </style>
  <g class="brayer-roll__handle"><path d="M38 10 L54 26" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="55" cy="27" r="5" fill="currentColor"/></g>
  <g class="brayer-roll__roller"><rect x="8" y="22" width="40" height="18" rx="9" fill="currentColor"/><circle cx="17" cy="31" r="2.5" fill="var(--lg-ground)"/></g>
  <rect class="brayer-roll__stripe" x="8" y="47" width="44" height="6" rx="3" fill="var(--lg-accent)"/>
</svg>
